    <rect x="22" y="22" width="776" height="856" rx="42" fill="#FFFDFB"/>
    <text x="84" y="108" class="title">Create Booking</text>
    <rect x="72" y="158" width="676" height="68" rx="22" fill="white"/>
    <rect x="72" y="266" width="676" height="68" rx="22" fill="white"/>
    <rect x="72" y="374" width="676" height="68" rx="22" fill="white"/>
    <text x="92" y="148" class="small">Room</text>
    <text x="92" y="200" class="small">Select Room</text>
    <text x="92" y="256" class="small">Start Date &amp; Time</text>
    <text x="92" y="308" class="small">01 Apr 2026, 10:00 AM</text>
    <text x="92" y="364" class="small">End Date &amp; Time</text>
    <text x="92" y="416" class="small">01 Apr 2026, 11:00 AM</text>
    <text x="92" y="488" class="subtitle">Available slot detected for selected room</text>
    <rect x="72" y="548" width="676" height="74" rx="26" fill="#F27038"/>
    <text x="410" y="595" text-anchor="middle" class="buttonText">Save Booking</text>
    <rect x="72" y="660" width="676" height="60" rx="20" fill="#E7F6EC"/>
    <text x="410" y="698" text-anchor="middle" class="small" fill="#2E7D32">Booking will sync after creation</text>
  </g>
  <text x="1680" y="3240" text-anchor="middle" class="screenName">6. Create Booking</text>

  <!-- Screen 7 Edit Booking -->
  <g transform="translate(110,3350)" filter="url(#shadow)">
    <rect width="820" height="900" rx="54" fill="#1C1C1C"/>
    <rect x="22" y="22" width="776" height="856" rx="42" fill="#FFFDFB"/>
    <text x="84" y="108" class="title">Edit Booking</text>
    <rect x="72" y="158" width="676" height="68" rx="22" fill="white"/>
    <rect x="72" y="266" width="676" height="68" rx="22" fill="white"/>
    <rect x="72" y="374" width="676" height="68" rx="22" fill="white"/>
    <text x="92" y="200" class="small">Delta 101A</text>
    <text x="92" y="308" class="small">01 Apr 2026, 10:00 AM</text>
    <text x="92" y="416" class="small">01 Apr 2026, 11:30 AM</text>
    <rect x="72" y="532" width="676" height="74" rx="26" fill="#F27038"/>
    <rect x="72" y="626" width="676" height="60" rx="20" fill="#FFF3EB"/>
    <text x="410" y="579" text-anchor="middle" class="buttonText">Update Booking</text>
    <text x="410" y="664" text-anchor="middle" class="darkBtnText">Discard</text>
  </g>
