    <text x="380" y="318" class="subtitle">Account details and quick actions</text>
    <rect x="380" y="360" width="376" height="160" rx="24" fill="#F4F7FB"/>
    <text x="410" y="410" class="small">Name: Akash</text>
    <text x="410" y="448" class="small">User ID: usr_1098</text>
    <text x="410" y="486" class="small">Device ID: Device-01</text>
    <rect x="380" y="560" width="376" height="68" rx="24" fill="#FDE1D0"/>
    <rect x="380" y="648" width="376" height="68" rx="24" fill="#D85A1A"/>
    <text x="568" y="603" text-anchor="middle" class="darkBtnText">About</text>
    <text x="568" y="691" text-anchor="middle" class="buttonText">Logout</text>
  </g>
  <text x="520" y="3240" text-anchor="middle" class="screenName">5. Profile Drawer</text>

