  <!-- Screen 8 Conflict -->
  <g transform="translate(1270,3350)" filter="url(#shadow)">
    <rect width="820" height="980" rx="54" fill="#1C1C1C"/>
    <rect x="22" y="22" width="776" height="936" rx="42" fill="#FFFDFB"/>
    <text x="84" y="108" class="title">Resolve Conflict</text>
    <rect x="72" y="142" width="676" height="64" rx="22" fill="#FFF3CD"/>
    <text x="410" y="183" text-anchor="middle" class="small" fill="#8A6D1D">Two booking versions were found</text>
    <rect x="72" y="236" width="676" height="214" rx="28" fill="#F8FAFC" stroke="#2E7D32" stroke-width="3"/>
    <rect x="72" y="476" width="676" height="214" rx="28" fill="#F8FAFC" stroke="#D32F2F" stroke-width="3"/>
    <text x="100" y="284" class="label">Local Version</text>
    <text x="100" y="330" class="small">Room: Delta 101A</text>
    <text x="100" y="364" class="small">Time: 10:00 AM - 11:00 AM</text>
    <text x="100" y="398" class="small">Updated from Device-01</text>
    <text x="100" y="524" class="label">Remote Version</text>
    <text x="100" y="570" class="small">Room: Delta 101A</text>
    <text x="100" y="604" class="small">Time: 10:30 AM - 11:30 AM</text>
    <text x="100" y="638" class="small">Updated from Device-03</text>
    <rect x="72" y="742" width="676" height="74" rx="26" fill="#FFF3EB"/>
    <rect x="72" y="834" width="676" height="74" rx="26" fill="#F27038"/>
    <text x="410" y="788" text-anchor="middle" class="darkBtnText">Keep Local</text>
    <text x="410" y="881" text-anchor="middle" class="buttonText">Accept Remote</text>
  </g>
  <text x="1680" y="4370" text-anchor="middle" class="screenName">8. Conflict Resolution</text>

  <!-- Screen 9 Empty -->
  <g transform="translate(110,4400)" filter="url(#shadow)">
    <rect width="820" height="700" rx="54" fill="#1C1C1C"/>
    <rect x="22" y="22" width="776" height="656" rx="42" fill="#FFFDFB"/>
    <circle cx="410" cy="230" r="88" fill="#FFF3EB"/>
    <rect x="360" y="185" width="100" height="78" rx="18" fill="#FDE1D0"/>
    <rect x="372" y="205" width="76" height="46" rx="10" fill="white"/>
    <path d="M410 160V182" stroke="#F27038" stroke-width="10" stroke-linecap="round"/>
    <text x="410" y="370" text-anchor="middle" class="title">No bookings yet</text>
    <text x="410" y="410" text-anchor="middle" class="subtitle">Create your first booking to start managing room schedules</text>
    <rect x="178" y="470" width="464" height="74" rx="26" fill="#F27038"/>
    <text x="410" y="517" text-anchor="middle" class="buttonText">Create Booking</text>
  </g>
  <text x="520" y="5140" text-anchor="middle" class="screenName">9. Empty State</text>

  <!-- Screen 10 Offline -->
  <g transform="translate(1270,4400)" filter="url(#shadow)">
    <rect width="820" height="700" rx="54" fill="#1C1C1C"/>
    <rect x="22" y="22" width="776" height="656" rx="42" fill="#FFFDFB"/>
    <text x="84" y="118" class="title">Sync Status</text>
    <rect x="72" y="188" width="676" height="150" rx="28" fill="#FFF8E1"/>
    <rect x="102" y="220" width="124" height="38" rx="19" fill="#F9A825"/>
    <text x="164" y="244" text-anchor="middle" class="status">Offline</text>
    <text x="102" y="286" class="subtitle">Your changes will sync when network is back</text>
    <rect x="72" y="374" width="676" height="118" rx="28" fill="#F8FAFC"/>
    <rect x="102" y="406" width="136" height="38" rx="19" fill="#2E7D32"/>
    <text x="170" y="430" text-anchor="middle" class="status">Connected</text>
    <text x="102" y="472" class="subtitle">Connected to peers successfully</text>
  </g>
  <text x="1680" y="5140" text-anchor="middle" class="screenName">10. Offline / Sync State</text>
</svg>
