plugins {
    alias(libs.plugins.android.application)
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new java.util.Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def debugApiBaseUrl = providers.gradleProperty("ROOM_BOOKING_DEBUG_API_BASE_URL")
        .orElse("http://10.50.48.251:8000/")
        .get()
def releaseApiBaseUrl = providers.gradleProperty("ROOM_BOOKING_API_BASE_URL")
        .orElse("http://13.235.231.5/")
        .get()

if (!debugApiBaseUrl.endsWith("/")) {
    debugApiBaseUrl += "/"
}

if (!releaseApiBaseUrl.endsWith("/")) {
    releaseApiBaseUrl += "/"
}

def requiredSigningProperties = [
        "storeFile",
        "storePassword",
        "keyAlias",
        "keyPassword"
]
def hasReleaseSigning = keystorePropertiesFile.exists()
        && requiredSigningProperties.every { key ->
    keystoreProperties.getProperty(key) != null
            && !keystoreProperties.getProperty(key).trim().isEmpty()
}
def resolveSigningFile = { String path ->
    if (path.startsWith("~/")) {
        return file(System.getProperty("user.home") + path.substring(1))
    }

    return rootProject.file(path)
}
def requestedReleaseBuild = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(java.util.Locale.ROOT).contains("release")
}
if (requestedReleaseBuild && !hasReleaseSigning) {
    throw new GradleException(
            "Release signing requires root keystore.properties with "
                    + "storeFile, storePassword, keyAlias, and keyPassword."
    )
}

android {
    namespace 'com.example.roombooking'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.roombooking"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile resolveSigningFile(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"${debugApiBaseUrl}\""
        }
        release {
            buildConfigField "String", "API_BASE_URL", "\"${releaseApiBaseUrl}\""
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.annotation
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.work.runtime
    implementation libs.okhttp.v4120
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
