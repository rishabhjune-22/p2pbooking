plugins {
    alias(libs.plugins.android.application)
}

def debugApiBaseUrl = providers.gradleProperty("ROOM_BOOKING_DEBUG_API_BASE_URL")
        .orElse("http://10.50.48.251:8000/")
        .get()
def releaseApiBaseUrl = providers.gradleProperty("ROOM_BOOKING_API_BASE_URL")
        .orElse("https://booking.internal.example/")
        .get()

if (!debugApiBaseUrl.endsWith("/")) {
    debugApiBaseUrl += "/"
}

if (!releaseApiBaseUrl.endsWith("/")) {
    releaseApiBaseUrl += "/"
}

if (!releaseApiBaseUrl.startsWith("https://")) {
    throw new GradleException("ROOM_BOOKING_API_BASE_URL must use HTTPS")
}

android {
    namespace 'com.example.roombooking'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.p2proombooking"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"${debugApiBaseUrl}\""
        }
        release {
            buildConfigField "String", "API_BASE_URL", "\"${releaseApiBaseUrl}\""
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.annotation
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.work.runtime
    implementation libs.okhttp.v4120
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
